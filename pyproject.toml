[project]
name = "stats-ev-solver"
version = "0.1.0"
description = "Underdog Pick'em prop pricing platform: best-value and most-likely bets for MLB, NFL and CFB"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
# Only needed when DATABASE_URL points at Postgres. SQLite needs no driver.
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = ["ignore::DeprecationWarning"]
